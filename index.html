<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syahrul Manga Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; }
        .manga-card { background: #111; border: 1px solid #333; transition: 0.3s; }
        .manga-card:hover { border-color: #ff0000; transform: scale(1.02); }
    </style>
</head>
<body class="p-4">

    <header class="text-center py-10">
        <h1 class="text-5xl font-black text-red-600 italic tracking-tighter">SYAHRUL OTAKU</h1>
        <p class="text-[10px] text-gray-500 mt-2 uppercase">Klik Gambar = Langsung Ke Komiknya</p>
    </header>

    <div class="max-w-md mx-auto mb-10 px-4">
        <input type="text" id="searchInput" onkeyup="if(event.key==='Enter') cari()" 
               placeholder="Cari judul (Contoh: One Piece)..." 
               class="w-full p-4 bg-neutral-900 rounded-xl outline-none border border-red-900 focus:border-red-500">
    </div>

    <div id="mangaGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-5 max-w-7xl mx-auto">
        <p class="col-span-full text-center py-20 text-red-500 animate-bounce">Tunggu bentar, lagi narik data...</p>
    </div>

    <script>
        // Fungsi ambil data viral
        async function loadData(url = 'https://api.jikan.moe/v4/top/manga?limit=30') {
            const grid = document.getElementById('mangaGrid');
            try {
                const res = await fetch(url);
                const json = await res.json();
                
                grid.innerHTML = json.data.map(m => `
                    <div class="manga-card p-3 rounded-2xl cursor-pointer" onclick="baca('${m.title}')">
                        <img src="${m.images.jpg.image_url}" class="w-full h-56 object-cover rounded-xl mb-3">
                        <h3 class="text-[11px] font-bold truncate uppercase text-red-50">${m.title}</h3>
                        <p class="text-[9px] text-red-500 mt-1 font-black">BACA SEKARANG →</p>
                    </div>
                `).join('');
            } catch (e) {
                grid.innerHTML = '<p class="col-span-full text-center text-red-600">Gagal koneksi. Cek sinyal lu!</p>';
            }
        }

        // FUNGSI INI YANG PENTING: Langsung lempar ke web baca
        function baca(judul) {
            // Kita arahkan ke pencarian komiku/komikcast yang lebih akurat
            const url = `https://www.google.com/search?q=baca+manga+${encodeURIComponent(judul)}+bahasa+indonesia`;
            window.open(url, '_blank');
        }

        function cari() {
            const q = document.getElementById('searchInput').value;
            if(q) loadData(`https://api.jikan.moe/v4/manga?q=${q}&limit=30`);
        }

        loadData();
    </script>
</body>
</html>
