<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syahrul Otaku Portal V3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; overflow-x: hidden; }
        .glass { background: rgba(20, 20, 20, 0.98); border: 1px solid #444; }
        /* Full Screen Reader */
        #phantomReader { display: none; position: fixed; inset: 0; z-index: 200; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }
        .loader { border: 4px solid #1a1a1a; border-top: 4px solid #ef4444; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-4">

    <header class="text-center py-8">
        <h1 class="text-5xl font-black text-red-600 italic drop-shadow-[0_0_10px_#f00]">SYAHRUL OTAKU</h1>
        <p class="text-[10px] tracking-[0.3em] text-gray-500 mt-2 uppercase">Phantom Edition V3.0</p>
    </header>

    <div id="mangaGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4 max-w-7xl mx-auto">
        </div>

    <div id="phantomReader">
        <div class="absolute top-0 left-0 w-full p-4 bg-gradient-to-b from-black to-transparent z-50 flex justify-between items-center">
            <span class="text-red-500 font-bold text-xs uppercase">Syahrul Shadow Mode</span>
            <button onclick="closeReader()" class="bg-red-600 text-white px-4 py-1 rounded-full font-bold">TUTUP [X]</button>
        </div>
        <iframe id="readerFrame" src=""></iframe>
    </div>

    <script>
        async function getManga() {
            const grid = document.getElementById('mangaGrid');
            try {
                const res = await fetch('https://api.jikan.moe/v4/top/manga?limit=30');
                const json = await res.json();
                grid.innerHTML = json.data.map(m => `
                    <div class="glass p-2 rounded-2xl cursor-pointer hover:scale-105 transition" onclick="openReader('${m.url}')">
                        <img src="${m.images.jpg.image_url}" class="w-full h-52 object-cover rounded-xl">
                        <h3 class="text-[10px] mt-3 font-bold truncate uppercase">${m.title}</h3>
                        <p class="text-[9px] text-red-500">TAP UNTUK BACA</p>
                    </div>
                `).join('');
            } catch (err) { grid.innerHTML = "<p>Internet lu bapuk, Rul!</p>"; }
        }

        function openReader(url) {
            const reader = document.getElementById('phantomReader');
            const frame = document.getElementById('readerFrame');
            // Kita arahkan ke web baca yang lebih ringan
            frame.src = url; 
            reader.style.display = 'block';
            document.body.style.overflow = 'hidden'; // Biar gak scroll dobel
        }

        function closeReader() {
            const reader = document.getElementById('phantomReader');
            const frame = document.getElementById('readerFrame');
            reader.style.display = 'none';
            frame.src = ""; // Stop loading pas ditutup
            document.body.style.overflow = 'auto';
        }

        getManga();
    </script>
</body>
</html>
